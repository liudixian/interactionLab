; InteractiveLab 插件配置（原 GenartLib）
; 插件由 GenartLib 更名为 InteractiveLab（模块 GenartLib -> InteractiveLab），
; WinUnit / GRWindowsHex / HexCell / HexGrid 迁移到 CreativeLab 插件。
; 本文件通过 CoreRedirects 保证旧资产与蓝图引用不断链。

[CoreRedirects]
; ---- 跨插件迁移：GenartLib -> CreativeLab ----
+ClassRedirects=(OldName="/Script/GenartLib.WinUnit", NewName="/Script/CreativeLab.WinUnit")
+ClassRedirects=(OldName="/Script/GenartLib.GRWindowsHex", NewName="/Script/CreativeLab.GRWindowsHex")
+StructRedirects=(OldName="/Script/GenartLib.HexCell", NewName="/Script/CreativeLab.HexCell")
+StructRedirects=(OldName="/Script/GenartLib.HexGrid", NewName="/Script/CreativeLab.HexGrid")

; ---- 模块整体改名：/Script/GenartLib -> /Script/InteractiveLab ----
+ClassRedirects=(OldName="/Script/GenartLib", NewName="/Script/InteractiveLab", MatchSubstring=true)
+StructRedirects=(OldName="/Script/GenartLib", NewName="/Script/InteractiveLab", MatchSubstring=true)
+EnumRedirects=(OldName="/Script/GenartLib", NewName="/Script/InteractiveLab", MatchSubstring=true)
+FunctionRedirects=(OldName="/Script/GenartLib", NewName="/Script/InteractiveLab", MatchSubstring=true)

; ---- 插件 Content 挂载点：/genartLib -> /InteractiveLab ----
+PackageRedirects=(OldName="/genartLib", NewName="/InteractiveLab", MatchSubstring=true)
